      color: #111827;

      gap: 6px;

      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

      border: none;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .nav-button:hover {

    }

    .nav-button.active {

    }

    }

  players.forEach(p => {

    if (p.highestPerf === undefined) p.highestPerf = p.rate;
  });

  window.onload = () => {
    reassignTeamsByRanking();
    createInputFields(6);
    updateAllTables();
  };

  function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-button').forEach(el => el.classList.remove('active'));
    
    if (tabName === 'admin') {
      document.getElementById('btn-admin').classList.add('active');
      if (isAdminUnlocked) {
        document.getElementById('tab-admin').classList.add('active');
      } else {
        document.getElementById('tab-admin-auth').classList.add('active');
      }
    } else {
      isAdminUnlocked = false;
      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.getElementById(`btn-${tabName}`).classList.add('active');
    }
  }

  // --- 完全難読化・微積分＆不可逆暗号認証 ---
  async function authenticateAdmin() {
    const inputEl = document.getElementById('editPassword');
    const authErrorMsg = document.getElementById('authErrorMsg');
    const inputPass = inputEl ? inputEl.value.trim() : '';

    if (!inputPass) {
      authErrorMsg.textContent = 'WA (Null Input): パスワードを入力してください。';
      authErrorMsg.style.display = 'block';
      return;
    }

    // 数値 998244353 をコード上に書かず、ビット演算で動的生成 (2^23 * 119 + 1)
    const MOD = ((1n << 23n) * 119n) + 1n;
    
    let seed = 0n;
    try {
      for (let i = 0; i < inputPass.length; i++) {
        seed = (seed * 131n + BigInt(inputPass.charCodeAt(i))) % MOD;
      }
    } catch (e) {
      seed = 0n;
    }

    // 微分演算（テイラー展開の2次近似）
    const f = (x) => (x**3n + 7n*(x**2n) + 13n*x + 42n) % MOD;
    const df = (x) => (3n*(x**2n) + 14n*x + 13n) % MOD;
    const d2f = (x) => (6n*x + 14n) % MOD;

    const calculusSignature = (f(seed) + df(seed) + d2f(seed)) % MOD;

    // ソルトの結合とSHA-256ハッシュ化
    const saltedPayload = `SALT_ENV_${calculusSignature.toString()}_${inputPass}`;
    
    const encoder = new TextEncoder();
    const data = encoder.encode(saltedPayload);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const computedHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    // 暗号化された正解ハッシュ値（文字としてのヒントは完全ゼロ）
    const TARGET_HASH = "64f49f04793bf6b10d1431f171b8e25b3cc2cd07752521e1ce4a2e70e8d1a0db";

    if (computedHash === TARGET_HASH) {
      isAdminUnlocked = true;
      authErrorMsg.style.display = 'none';
      inputEl.value = '';
      switchTab('admin');
    } else {
      authErrorMsg.innerHTML = `WA (Wrong Answer): 認証エラー。<br><small style="font-size:0.75rem; color:#9ca3af;">[Integrity Check Failed]</small>`;
      authErrorMsg.style.display = 'block';
      inputEl.value = '';
    }
  }

  function reassignTeamsByRanking() {
    players.sort((a, b) => b.rate - a.rate);

    const teams = ['A', 'B', 'C', 'D', 'E', 'F'];
    const total = players.length;
    const baseGroupSize = Math.floor(total / teams.length);
    const remainder = total % teams.length;

    let currentIdx = 0;
    teams.forEach((teamName, i) => {
      const size = baseGroupSize + (i < remainder ? 1 : 0);
      for (let j = 0; j < size; j++) {
        if (currentIdx < total) {
          players[currentIdx].team = teamName;
          currentIdx++;
        }
      }
    });
  }

  function createInputFields(count) {
    const container = document.getElementById('playerInputs');
    if (!container) return;
    container.innerHTML = '';
    
    for (let i = 0; i < count; i++) {
      const row = document.createElement('div');
      row.className = 'player-row';
      
      let options = players.map(p => `<option value="${p.id}">${p.name}（${p.team}チーム / Rate:${p.rate}）</option>`).join('');
      
      row.innerHTML = `
        <select class="match-player">${options}</select>
        <input type="number" class="match-score" placeholder="獲得枚数" min="0" max="100">
      `;
      container.appendChild(row);
    }
  }

  function submitMatch() {
    const playerSelects = document.querySelectorAll('.match-player');
    const scoreInputs = document.querySelectorAll('.match-score');
    const errorMsg = document.getElementById('errorMsg');
    
    if (errorMsg) errorMsg.style.display = 'none';

    let matchData = [];
    let totalScore = 0;

    for (let i = 0; i < playerSelects.length; i++) {
      const pId = parseInt(playerSelects[i].value);
      const score = parseInt(scoreInputs[i].value) || 0;
      const player = players.find(p => p.id === pId);

      if (!player) continue;

      matchData.push({ player, score });
      totalScore += score;
    }

    if (totalScore !== CONFIG.TOTAL_CARDS) {
      if (errorMsg) {
        errorMsg.textContent = `枚数の合計が ${totalScore} 枚になっています。合計が 100 枚になるように入力してください。`;
        errorMsg.style.display = 'block';
      }
      return;
    }

    const n = matchData.length;
    if (n === 0) return;

    const tableAvgRate = matchData.reduce((sum, m) => sum + m.player.rate, 0) / n;
    const baseCards = CONFIG.TOTAL_CARDS / n;

 matchData.forEach(m => {
      const player = m.player;
      
      // パフォーマンス履歴・Perfの配列構造を保証
      if (!player.perfHistory) player.perfHistory = [];

      // --- 1. Target Performance 計算 ---
      // 今回の試合単体の実力値 (Perf)
      const rawPerf = Math.round(1000 + tableAvgRate * 0.2 + (m.score - baseCards) * CONFIG.K_FACTOR);
      const targetPerf = Math.max(0, rawPerf);
      player.perfHistory.push(targetPerf);

      const k = player.perfHistory.length; // 参戦回数

      // --- 2. AtCoder公式: パフォーマンスの指数加重平均 (R_raw) ---
      let S = 0;
      let G = 0;
      for (let i = 0; i < k; i++) {
        const weight = Math.pow(0.9, k - 1 - i);
        S += weight;
        G += weight * Math.pow(2, player.perfHistory[i] / 800);
      }
      const R_raw = 800 * Math.log2(G / S);

      // --- 3. AtCoder公式: 参加回数補正関数 f(k) ---
      // 試合数が少ないうちは表示レートを大きく下方補正する
      const f_k = Math.sqrt(1 - Math.pow(0.81, k)) / S;
      const R_calc = R_raw - (f_k * 1200);

      // --- 4. AtCoder公式: 400未満の対数補正 ＆ 0未満ガード ---
      let displayRate = 0;
      if (R_calc >= 400) {
        displayRate = Math.round(R_calc);
      } else {
        // 400未満の領域では指数的に下落が滑らかになり、絶対に0未満にならない
        displayRate = Math.round(400 / Math.exp((400 - R_calc) / 400));
      }

      player.rate = Math.max(0, displayRate);
      
      // 履歴データ保存 (perf も一緒に記録)
      player.history.push({
        rate: player.rate,
        perf: targetPerf,
        score: m.score,
        team: player.team
      });
      
      // Highest 記録の更新
      if (player.highestRate === undefined || player.rate > player.highestRate) {
        player.highestRate = player.rate;
      }
      if (player.highestPerf === undefined || targetPerf > player.highestPerf) {
        player.highestPerf = targetPerf;
      }
    });
    reassignTeamsByRanking();
    saveData();
    updateAllTables();
    createInputFields(parseInt(document.getElementById('playerCountSelect').value));

    alert("レート計算とチーム再編が完了しました！");
    switchTab('ranking');
  }

  function addPlayer() {
    const nameInput = document.getElementById('newPlayerName');
    
    if (!nameInput || !nameInput.value.trim()) {
      alert("氏名を入力してください");
      return;
    }

    const newPlayer = {
      id: Date.now(),
      name: nameInput.value.trim(),
      team: "F",
      rate: 0,
      highestRate: 0,
      highestPerf: 0,
      history: [0]
    };

    players.push(newPlayer);
    reassignTeamsByRanking();
    saveData();
    createInputFields(parseInt(document.getElementById('playerCountSelect').value));
    updateAllTables();
    
    nameInput.value = '';
    alert(`${newPlayer.name} を追加しました！`);
    switchTab('ranking');
  }

  function resetToDefault() {
    if (confirm("本当に全員のレートとデータを最初の41名の状態（一律レート0）に戻しますか？")) {
      players = defaultPlayers;
      reassignTeamsByRanking();
      saveData();
      createInputFields(6);
      updateAllTables();
      alert("データを初期化しました。");
      switchTab('ranking');
    }
  }

  function saveData() {
    localStorage.setItem('karuta_players', JSON.stringify(players));
  }

  function updateAllTables() {
    updateIndividualRanking();
    updateTeamRanking();
  }

  function updateIndividualRanking() {
    const tbody = document.getElementById('rankingBody');
    const searchInput = document.getElementById('searchPlayer');
    if (!tbody) return;
    
    tbody.innerHTML = '';
    const query = searchInput ? searchInput.value.trim().toLowerCase() : '';

    let matchCount = 0;
    players.forEach((p, index) => {
      const cleanName = p.name.replace(/\s+/g, '').toLowerCase();
      const cleanQuery = query.replace(/\s+/g, '');

      if (cleanQuery === '' || cleanName.includes(cleanQuery)) {
        matchCount++;
        const tr = document.createElement('tr');
        if (index < 41) {
          tr.className = `rank-${index + 1}`;
        }
        
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td><span class="player-link team-text-${p.team}" onclick="openPlayerModal(${p.id})">${p.name}</span></td>
          <td><span class="team-badge team-${p.team}">${p.team}チーム</span></td>
          <td><strong>${p.rate}</strong></td>
        `;
        tbody.appendChild(tr);
      }
    });

    if (matchCount === 0) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="4" style="color: #6b7280; padding: 20px;">該当する生徒が見つかりません</td>`;
      tbody.appendChild(tr);
    }
  }

  function updateTeamRanking() {
    const tbody = document.getElementById('teamRankingBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    const teams = ['A', 'B', 'C', 'D', 'E', 'F'];
    const teamStats = teams.map(teamName => {
      const teamMembers = players.filter(p => p.team === teamName);
      const count = teamMembers.length;
      const totalRate = teamMembers.reduce((sum, p) => sum + p.rate, 0);
      const avgRate = count > 0 ? Math.round(totalRate / count) : 0;
      return { team: teamName, count, avgRate };
    });

    teamStats.sort((a, b) => b.avgRate - a.avgRate);

    teamStats.forEach((t, index) => {
      const tr = document.createElement('tr');
      if (index === 0) tr.className = 'rank-1';
      else if (index === 1) tr.className = 'rank-2';
      else if (index === 2) tr.className = 'rank-3';

      tr.innerHTML = `
        <td>${index + 1}</td>
        <td><span class="team-badge team-${t.team}">${t.team}チーム</span></td>
        <td>${t.count}名</td>
        <td><strong>${t.avgRate}</strong></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function openPlayerModal(playerId) {
    const player = players.find(p => p.id === playerId);
    if (!player) return;

    const rank = players.findIndex(p => p.id === playerId) + 1;

    document.getElementById('modalPlayerName').textContent = player.name;
    document.getElementById('modalPlayerTeam').innerHTML = `<span class="team-badge team-${player.team}">${player.team}チーム</span>`;
    document.getElementById('modalRank').textContent = `${rank} 位`;
    document.getElementById('modalRate').textContent = player.rate;
    document.getElementById('modalHighestRate').textContent = player.highestRate !== undefined ? player.highestRate : player.rate;
    document.getElementById('modalHighestPerf').textContent = player.highestPerf !== undefined ? player.highestPerf : player.rate;
    document.getElementById('modalMatches').textContent = `${player.history ? player.history.length - 1 : 0} 回`;

    document.getElementById('playerModal').classList.add('active');

    renderChart(player.history || [player.rate]);
  }

  function closePlayerModal(e) {
    if (e && e.target !== e.currentTarget && !e.target.classList.contains('modal-close')) return;
    document.getElementById('playerModal').classList.remove('active');
  }

function renderChart(history) {
    const ctx = document.getElementById('rateChart').getContext('2d');
    
    if (chartInstance) {
      chartInstance.destroy();
    }

    const normalizedHistory = history.map(h => typeof h === 'object' ? h : { rate: h, perf: null, score: null, team: null });
    const rates = normalizedHistory.map(h => h.rate);
    const labels = normalizedHistory.map((_, i) => i === 0 ? "初期" : `第${i}戦`);

    const teamBackgroundPlugin = {
      id: 'teamBackground',
      beforeDraw(chart) {
        const { ctx, chartArea: { top, bottom, left, right }, scales: { y } } = chart;
        if (!y) return;

        const teamBands = [
          { team: 'A', color: 'rgba(239, 68, 68, 0.15)' },
          { team: 'B', color: 'rgba(59, 130, 246, 0.15)' },
          { team: 'C', color: 'rgba(16, 185, 129, 0.15)' },
          { team: 'D', color: 'rgba(245, 158, 11, 0.15)' },
          { team: 'E', color: 'rgba(139, 92, 246, 0.15)' },
          { team: 'F', color: 'rgba(100, 116, 139, 0.15)' }
        ];

        const teams = ['A', 'B', 'C', 'D', 'E', 'F'];
        const ranges = {};

        teams.forEach(t => {
          const members = players.filter(p => p.team === t);
          if (members.length > 0) {
            const rList = members.map(p => p.rate);
            ranges[t] = {
              max: Math.max(...rList),
              min: Math.min(...rList)
            };
          }
        });

        teamBands.forEach(b => {
          const range = ranges[b.team];
          if (!range) return;

          const yTop = Math.max(top, y.getPixelForValue(range.max));
          const yBottom = Math.min(bottom, y.getPixelForValue(range.min));

          if (yBottom > yTop) {
            ctx.save();
            ctx.fillStyle = b.color;
            ctx.fillRect(left, yTop, right - left, yBottom - yTop);
            ctx.restore();
          }
        });
      }
    };

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Rating',
          data: rates,
          borderColor: '#1a73e8',
          borderWidth: 2,
          fill: false,
          tension: 0.2,
          pointRadius: 5,
          pointHoverRadius: 7,
          pointBackgroundColor: '#1a73e8'
        }]
      },
      plugins: [teamBackgroundPlugin],
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                const index = context.dataIndex;
                const item = normalizedHistory[index];
                const rateVal = context.parsed.y;
                
                if (index === 0) {
                  return ` Rate: ${rateVal} (初期状態)`;
                }
                
                const perfText = item.perf !== null ? item.perf : '-';
                const scoreText = item.score !== null ? `${item.score}枚` : '不明';
                const teamText = item.team ? `${item.team}チーム` : '-';
                
                return [
                  ` Rate: ${rateVal}`,
                  ` Perf: ${perfText}`,
                  ` 獲得枚数: ${scoreText}`,
                  ` 当時所属: ${teamText}`
                ];
              }
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: { color: '#e5e7eb' },
            ticks: { font: { size: 11 } }
          },
          x: {
            grid: { display: false },
            ticks: { font: { size: 11 } }
          }
        }
      }
    });
  }
</script>
